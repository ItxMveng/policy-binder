name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Installer Python 3.12 et les dépendances
        run: uv sync --frozen --python 3.12
      - name: Ruff (lint + format)
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Mypy strict
        run: uv run mypy --strict src
      - name: Tests
        run: uv run pytest -q
      - name: Image Docker
        run: docker build -t policy-binder:ci .

  front:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installer les dépendances
        run: npm ci
      - name: Types, lint, tests
        run: |
          npm run typecheck
          npm run lint
          npm test
      - name: Build de production
        run: npm run build

  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dossier: [infra/azure, infra/terraform]
    defaults:
      run:
        working-directory: ${{ matrix.dossier }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Format et validation (sans compte cloud)
        run: |
          terraform fmt -check
          terraform init -backend=false -input=false
          terraform validate
